name: omp-digicoach

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: omp
      POSTGRES_PASSWORD: omp
      POSTGRES_DB: omp
    ports:
      # 5434 on this machine, because other projects' databases use 5432 and 5433.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omp -d omp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
