# DigitalOcean App Platform spec. A draft until phase 7, which chooses the region, creates the
# database cluster, fills in cluster_name and validates this file with
# `doctl apps spec validate .do/app.yaml`. No secrets belong in this file.
name: omp-digicoach

services:
  - name: web
    github:
      repo: sadiash/omp-digicoach
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    # Compiled JavaScript only. Migrations never run here: the migrate job below runs them once.
    run_command: npm run start -w server
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: sadiash/omp-digicoach
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run db:migrate -w server
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1

databases:
  - name: db
    engine: PG
    production: true
    cluster_name: SET-IN-PHASE-7
    db_name: omp
    db_user: omp

envs:
  - key: NODE_ENV
    value: production
    scope: RUN_TIME
    type: GENERAL
  - key: PORT
    value: '8080'
    scope: RUN_TIME
    type: GENERAL
  - key: DATABASE_URL
    value: ${db.DATABASE_URL}
    scope: RUN_TIME
    type: GENERAL
  - key: DATABASE_CA_CERT
    value: ${db.CA_CERT}
    scope: RUN_TIME
    type: GENERAL
